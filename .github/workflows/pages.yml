name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Liste des sons
        run: python3 outils/sons.py

      - name: Assemblage du site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js reglages.json icones sons _site/
          find _site/sons -name README.md -delete
          # nouvelle version du cache hors ligne à chaque commit
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
